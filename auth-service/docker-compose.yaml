services:
  deploy-app:
    build:
      context: ${AUTH_SERVICE_ROOT}
      dockerfile: ${AUTH_SERVICE_ROOT}/Dockerfile
    container_name: auth-service
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-168h}
    volumes:
      - ${AUTH_SERVICE_ROOT}/out/logs:/app/out/logs
    ports:
      - "5050:5050"
    restart: always

  postgres:
    image: postgres:16-bookworm
    container_name: auth-service-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${AUTH_SERVICE_ROOT}/out/pgdata:/var/lib/postgresql/data
    restart: always

  postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${AUTH_SERVICE_ROOT}/migrations:/migrations

  swagger:
    build:
      context: ${AUTH_SERVICE_ROOT}
      dockerfile_inline: |
        FROM golang:1.25.0-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${AUTH_SERVICE_ROOT}:/code
