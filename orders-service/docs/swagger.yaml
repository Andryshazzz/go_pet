basePath: /api/v1
definitions:
  github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.CreateOrderRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.OrderItemDTO'
        minItems: 1
        type: array
    required:
    - items
    type: object
  github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.CreateOrderResponse:
    properties:
      order:
        $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.OrderDTO'
    type: object
  github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.GetOrderResponse:
    properties:
      order:
        $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.OrderDTO'
    type: object
  github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.ListOrdersResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.OrderDTO'
        type: array
      total:
        type: integer
    type: object
  github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.OrderDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.OrderItemDTO'
        type: array
      status:
        type: string
      total_price:
        type: number
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.OrderItemDTO:
    properties:
      name:
        example: Pizza
        maxLength: 255
        minLength: 1
        type: string
      price:
        example: 12.5
        minimum: 0
        type: number
      quantity:
        example: 2
        maximum: 1000
        minimum: 1
        type: integer
    required:
    - name
    - price
    - quantity
    type: object
  github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse:
    properties:
      error:
        description: Error contains the technical error details for debugging.
        type: string
      message:
        description: Message contains the human-readable error description.
        type: string
    type: object
host: 127.0.0.1:5051
info:
  contact: {}
  description: API for Golang app
  title: Golang app API
  version: "1.0"
paths:
  /orders:
    get:
      description: Returns all orders belonging to the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: List of orders
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.ListOrdersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
      security:
      - BearerAuth: []
      summary: List user's orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: |-
        Creates a new order for the authenticated user
        Sends a message to Kafka when order is created
      parameters:
      - description: Order data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Order created
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.CreateOrderResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
      security:
      - BearerAuth: []
      summary: Create a new order
      tags:
      - Orders
  /orders/{id}:
    get:
      description: Returns order details. User can only access their own orders.
      parameters:
      - description: Order ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Order details
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_internal_domain_dto.GetOrderResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
        "403":
          description: Access denied
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Andryshazzz_go_pet_orders-service_pkg_httpserver_response.ErrorsResponse'
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - Orders
swagger: "2.0"
